[tool.briefcase]
project_name = "MonicoiOS"
bundle = "com.jaykk99.monicoios"
version = "4.4.0"
url = "https://github.com/jaykk99/monico-ios-v25"
license = "MIT"

[tool.briefcase.app.monicoios]
formal_name = "Monico"
description = "Monico iOS v4.3 - On-device AI terminal"
sources = ["src/monicoios"]
requires = [
    "toga-ios",
    "microdot",
]
# NOTE: psutil is intentionally NOT in the iOS requires list - it ships no
# iOS wheels. The app degrades gracefully without it (health/forensics show
# UNAVAILABLE); desktop dev installs psutil via requirements.txt.
supported_devices = ["iPhone", "iPad"]

[tool.briefcase.app.monicoios.ios]
